events {}

http {
    upstream booking_api {
        server api1:8080 max_fails=1 fail_timeout=10s;
        server api2:8080 max_fails=1 fail_timeout=10s;
        server api3:8080 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://booking_api;
            proxy_set_header Host $host;

            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;
        }
    }
}